<aside class="sidebar">
  <a class="brand" routerLink="/">
    <span class="brand-mark">F</span>
    <span>Freelance<span class="brand-accent">Flow</span></span>
  </a>
  <div class="workspace-label">WORKSPACE</div>
  <nav>
    @for (item of nav; track item.route) {
      <a [routerLink]="item.route" routerLinkActive="active" [routerLinkActiveOptions]="{exact: item.route === '/'}">
        <span class="nav-icon">{{ item.icon }}</span><span>{{ item.label }}</span>
      </a>
    }
  </nav>
  <div class="sidebar-footer">
    <div class="profile-avatar">TB</div>
    <div class="profile-copy"><strong>Thasniya Beevi</strong><span>Independent developer</span></div>
  </div>
</aside>

<main class="main-shell">
  <header class="topbar">
    <div class="topbar-title"><span class="online-dot"></span><span>Workspace</span></div>
    <div class="topbar-actions"><button class="icon-button" aria-label="Notifications">◔</button><div class="top-avatar">TB</div></div>
  </header>
  <div class="content"><router-outlet /></div>
</main>

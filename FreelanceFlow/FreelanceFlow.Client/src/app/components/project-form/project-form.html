<section class="page form-page"><a routerLink="/projects" class="back">← Projects</a><div class="form-card"><span class="eyebrow">NEW PROJECT</span><h1>Start a project</h1><p>Create a project and keep its budget and deadline visible from day one.</p><form [formGroup]="form" (ngSubmit)="submit"><label>Client<select formControlName="clientId"><option [value]="0">Select a client</option>@for(c of clientOptions;track c.id){<option [value]="c.id">{{c.companyName || c.name}}</option>}</select></label><label>Project title<input formControlName="title" placeholder="e.g. Property management portal"></label><label>Description<textarea formControlName="description" rows="4" placeholder="What are you delivering?"></textarea></label><div class="two"><label>Budget<input type="number" formControlName="budget"></label><label>Deadline<input type="date" formControlName="deadline"></label></div><label>Status<select formControlName="status"><option>Planning</option><option>In Progress</option><option>On Hold</option><option>Completed</option></select></label><div class="actions"><a routerLink="/projects">Cancel</a><button type="submit">Create project</button></div></form></div></section>
